<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leave Application</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
body{
    font-family:Segoe UI,Arial;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1800px;
    margin:auto;
}

.header{
    background:#2E75B6;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    margin-bottom:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    margin-bottom:20px;
}

.form-row{
    display:grid;
    grid-template-columns:100px 1fr;
    margin-bottom:12px;
    align-items:center;
}
#date{
    max-width:220px;
}

label{
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    height:90px;
}

button{
    background:#2E75B6;
    color:white;
    border:none;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#225c91;
}

.employeeFilter{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:15px;
}

.employeeFilter label{
    font-weight:normal;
}

.filterBar{
    display:flex;
    gap:15px;
    align-items:center;
    margin-bottom:15px;
}
.monthButtons{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
}
.yearButtons{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
}

.yearBtn{
    background:#E7E6E6;
    color:black;
    border:1px solid #999;
    padding:8px;
    cursor:pointer;
    border-radius:4px;
}

.yearBtn.active{
    background:#FFFF00;
    color:black;
    font-weight:bold;
}
.monthBtn{
    background:#E7E6E6;
    color:black;
    border:1px solid #999;
    padding:8px;
    cursor:pointer;
    border-radius:4px;
}

.monthBtn.active{
    background:#FFFF00;
    font-weight:bold;
}
.calendarTable{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
    font-size:12px;
}

.calendarTable th,
.calendarTable td{
    border:1px solid #ccc;
    text-align:center;
    padding:4px;
    height:38px;
    box-sizing:border-box;
}


.calendarTable th{
    background:#2E75B6;
    color:black;
    font-weight:bold;
}
.nameCol{
    width:180px;
    position:sticky;
    left:0;
    background:white;
}

.legend{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-top:10px;
    margin-bottom:20px;
}

.legendBox{
    width:20px;
    height:20px;
    border:1px solid #888;
    display:inline-block;
}

.weekend{
    background:#FCE4D6;
}

.allHoliday{
    background:#FFFF00;
}

.klmHoliday{
    background:#8FD3FF;
}

.penHoliday{
    background:#A9D18E;
}

.rphHoliday{
    background:#FFFF99;
}

/* Today column */
.todayColumn{
    background-color:#E2EFDA !important;
    background-image:
      radial-gradient(#A8D08D 1px, transparent 1px);
    background-size:6px 6px;
}

/* Leave Colors */
.alLeave{
    background:#00B0F0 !important;
    color:black;
    font-weight:bold;
}

.mcLeave{
    background:#0070C0 !important;
    color:black;
    font-weight:bold;
}

.elLeave{
    background:#FF0000 !important;
    color:black;
    font-weight:bold;
}

.wfhLeave{
    background:#FFC000 !important;
    color:black;
    font-weight:bold;
}

.penLeave{
    background:#92D050 !important;
    color:black;
    font-weight:bold;
}

.klmLeave{
    background:#9DC3E6 !important;
    color:black;
    font-weight:bold;
}

.otLeave{
    background:#FFD966 !important;
    color:black;
    font-weight:bold;
}

.summaryTable{
    min-width:650px;
    border-collapse:collapse;
    table-layout:fixed;
    font-size:12px;
}

.summaryTable th,
.summaryTable td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

.summaryTable th{
    background:#2E75B6;
    color:white;
}

.leaveRecordTable{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

.leaveRecordTable th{
    background:#2E75B6;
    color:white;
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

.leaveRecordTable td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

.leaveRecordTable tr:nth-child(even){
    background:#f8f8f8;
}

.leaveRecordTable tr:hover{
    background:#EAF3FF;
}

.leaveRecordTable button{
    padding:6px 12px;
    margin:2px;
    min-width:70px;
}


.filterGroup{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.filterTitle{
    width:250px;          /* same width as button grid */
    text-align:center;
    font-size:20px;
    font-weight:bold;
    text-decoration:underline;
    margin-bottom:10px;
}

.yearButtons,
.monthButtons{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
    width:250px;
}

.employeeFilter label{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-weight:normal;
}

.employeeFilter input[type="checkbox"]{
    width:28px;
    height:28px;
    cursor:pointer;
}

.employeeFilter{
    display:flex;
    justify-content:left;
    gap:50px;
    flex-wrap:wrap;
    margin-top:20px;
}

.calendarHeader{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.calendarHeader h2{
    margin:0;
}

.calendarHeader button{
    height:40px;
    padding:0 20px;
}


.flatpickr-calendar{
    font-size:14px;
}

.flatpickr-day{
    height:38px;
    line-height:38px;
}

.flatpickr-month{
    height:50px;
}

@media (max-width:768px){

    body{
        padding:10px;
    }

    .card{
        padding:12px;
    }

    .form-row{
        grid-template-columns:90px 1fr;
    }

    .filterBar{
        flex-direction:column;
        align-items:flex-start;
    }

    .employeeFilter{
        justify-content:center;
        gap:20px;
    }

    .employeeFilter label{
        width:120px;
        text-align:center;
    }

    #date{
        max-width:180px;
    }
}
.summaryTable td:first-child,
.summaryTable th:first-child{
    width:180px !important;
    font-size:12px;
    word-break:break-word;
}
@media (max-width:768px){

    .summaryTable{
        min-width:650px;
        font-size:11px;
    }

    .summaryTable td,
    .summaryTable th{
        padding:4px;
    }
}


</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="legend">

</div>

R.P.H
</div>

<div class="calendarHeader">

    <h2>
        Monthly Team Calendar
    </h2>

<button onclick="refreshDashboardData()">
    Refresh
</button>

</div>
<div style="overflow:auto">

<table class="calendarTable"
id="calendarTable">

</table>

</div>



</div>

<div class="card">

<h2>
Monthly Summary
</h2>

<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">

<table class="summaryTable">

<tr>

<th style="width:180px;background:#2E75B6;color:black;">Name</th>

<th style="width:45px;background:#2E75B6;color:black;">AL</th>
<th style="width:45px;background:#2E75B6;color:black;">AM AL</th>

<th style="width:45px;background:#2E75B6;color:black;">WFH</th>
<th style="width:45px;background:#2E75B6;color:black;">PEN</th>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script><script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyP2BlgeC5IqONTzSV6MxDdlqARMerLZf1ssIeT4_qUqz0Hl-tXkKL7TVLojmaESNEFFw/exec";

let selectedMonth;
let selectedYear;

document.addEventListener("DOMContentLoaded", () => {

    flatpickr("#date",{
        dateFormat:"Y-m-d",
        defaultDate:new Date(),
        allowInput:false,
        monthSelectorType:"static",
        animate:true,
        clickOpens:true
    });

    loadDashboard();

});

console.log("Dashboard Loading...");

async function loadDashboard(){

console.log("Fetching Dashboard API...");

    const response =
        await fetch(
            API_URL + "?action=dashboard"
        );

    const data =
        await response.json();
console.log(data);



window.dashboardData = data;

const today = new Date();

selectedMonth =
    today.getMonth() + 1;

document
.querySelector(
`.monthBtn[data-month="${selectedMonth}"]`
)
.classList.add("active");


selectedYear =
    today.getFullYear();

document
.querySelector(
`.yearBtn[data-year="${selectedYear}"]`
)
.classList.add("active");


    populateEmployees(
        data.employees
    );

console.log(data.employees);

buildEmployeeFilter(
    data.employees
);


document
.querySelectorAll(".monthBtn")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        document
        .querySelectorAll(".monthBtn")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        selectedMonth =
            parseInt(btn.dataset.month);

        renderDashboard();
        renderLeaveRecords();

    });

});

document
.querySelectorAll(".yearBtn")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        document
        .querySelectorAll(".yearBtn")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        selectedYear =
            parseInt(
                btn.dataset.year
            );

        renderDashboard();
        renderLeaveRecords();

    });

});

renderDashboard();
renderLeaveRecords();
}


function populateEmployees(
    employees
){

    let html =
    '<option value="">-- Select Employee --</option>';

    employees.forEach(emp=>{

        html += `
        <option value="${emp[0]}">
            ${emp[0]}
        </option>
        `;

    });

    document
    .getElementById("name")
    .innerHTML = html;
}

function buildEmployeeFilter(
    employees
){

    const container =
        document.getElementById(
            "employeeFilter"
        );

    let html = "";

    employees.forEach(emp=>{

        html += `
        <label>
            ${emp[0]}

            <input
                type="checkbox"
                class="empFilter"
                value="${emp[0]}"
                checked
                onchange="renderDashboard()">

        </label>
        `;

    });

    container.innerHTML = html;
}


function renderDashboard(){

const month = selectedMonth;

const year = selectedYear;

const checkedEmployees =
    [...document.querySelectorAll(".empFilter")]
        .filter(x=>x.checked)
        .map(x=>x.value);

renderCalendar(
    checkedEmployees,
    month,
    year
);

renderSummary(
    checkedEmployees,
    month,
    year
);

renderLeaveRecords();

}

function renderCalendar(employees, month, year){

    const table = document.getElementById("calendarTable");

    const daysInMonth = new Date(year, month, 0).getDate();

    const today = new Date();

    let html = `
    <tr>
        <th class="nameCol">Name</th>
    `;

    for(let day=1; day<=daysInMonth; day++){

        const d = new Date(year, month-1, day);

        const isWeekend =
            d.getDay() === 0 ||
            d.getDay() === 6;

        const isToday =
            d.getDate() === today.getDate() &&
            d.getMonth() === today.getMonth() &&
            d.getFullYear() === today.getFullYear();

let style = "";

let holidayType = "";
let holidayName = "";


dashboardData.holidays.forEach(h=>{

    const holidayDateString =
        String(h[0]).substring(0,10);

    const holidayYear =
        parseInt(holidayDateString.substring(0,4));

    const holidayMonth =
        parseInt(holidayDateString.substring(5,7));

    const holidayDay =
        parseInt(holidayDateString.substring(8,10));

    if(
        holidayYear === year &&
        holidayMonth === month &&
        holidayDay === day
    ){
holidayType =
    String(h[2]).toUpperCase();

holidayName =
    h[1];

    }

});



if(holidayType==="ALL"){
    style =
    "background:#FFFF00;color:black;font-weight:bold;";
}
else if(holidayType==="KLM"){
    style =
    "background:#8FD3FF;color:black;font-weight:bold;";
}
else if(holidayType==="PEN"){
    style =
    "background:#A9D18E;color:black;font-weight:bold;";
}
else if(holidayType==="RPH"){
    style =
    "background:#FFFF99;color:black;font-weight:bold;";
}

else if(isWeekend){
    style =
    "background:#FCE4D6;color:black;";
}

if(isToday){

    style += `
    background-color:#E2EFDA;
    background-image:
      radial-gradient(#A8D08D 1px, transparent 1px);
    background-size:6px 6px;
    `;
}
html += `
<th
title="${holidayName}"
style="color:black;${style}">
    ${day}
</th>
`;

    }

    html += "</tr>";

    employees.forEach(emp=>{

        html += `
        <tr>
            <td class="nameCol">${emp}</td>
        `;

        for(let day=1; day<=daysInMonth; day++){

            const currentDate =
                new Date(year, month-1, day);

            const isWeekend =
                currentDate.getDay() === 0 ||
                currentDate.getDay() === 6;

            const isToday =
                currentDate.getDate() === today.getDate() &&
                currentDate.getMonth() === today.getMonth() &&
                currentDate.getFullYear() === today.getFullYear();

let value = "";
let cellClass = "";
let holidayClass = "";
let holidayName = "";


dashboardData.holidays.forEach(h=>{

const holidayDateString =
    String(h[0]).substring(0,10);

const holidayYear =
    parseInt(holidayDateString.substring(0,4));

const holidayMonth =
    parseInt(holidayDateString.substring(5,7));

const holidayDay =
    parseInt(holidayDateString.substring(8,10));

if(
    holidayYear === year &&
    holidayMonth === month &&
    holidayDay === day
)
{

        const holidayType =
            String(h[2]).toUpperCase();

holidayName = h[1];

        if(holidayType === "ALL"){
            holidayClass = "allHoliday";
        }
        else if(holidayType === "KLM"){
            holidayClass = "klmHoliday";
        }
        else if(holidayType === "PEN"){
            holidayClass = "penHoliday";
        }
        else if(
            holidayType === "RPH" ||
            holidayType === "PUBLIC HOLIDAY"
        ){
            holidayClass = "rphHoliday";
        }
    }

});
dashboardData.leaves.forEach(row=>{


                const name = row[1];

const leaveDate =
    new Date(row[2]);


                const leaveType = row[3];

                if(
                    name === emp &&
                    leaveDate.getFullYear() === year &&
                    leaveDate.getMonth()+1 === month &&
                    leaveDate.getDate() === day
                ){
                    value = leaveType;
                }
            });

            if(
                value === "A.L" ||
                value === "AM A.L" ||
                value === "PM A.L"
            ){
                cellClass = "alLeave";
            }
            else if(value === "MC"){
                cellClass = "mcLeave";
            }
            else if(value === "E.L"){
                cellClass = "elLeave";
            }
            else if(value === "WFH"){
                cellClass = "wfhLeave";
            }
            else if(value === "PEN"){
                cellClass = "penLeave";
            }
            else if(value === "KLM"){
                cellClass = "klmLeave";
            }
            else if(value === "OT"){
                cellClass = "otLeave";
            }
else{

    if(isToday){
        cellClass="todayColumn";
    }
    else if(holidayClass){
        cellClass=holidayClass;
    }
    else if(isWeekend){
        cellClass="weekend";
    }
}



html += `
<td
title="${holidayName}"
class="${cellClass}">
    ${value}
</td>
`;
        }

        html += "</tr>";
    });

    table.innerHTML = html;
}

function renderSummary(
    employees,
    month,
    year
){

    const body =
        document.getElementById(
            "summaryBody"
        );

    let html = "";

    employees.forEach(emp=>{

        const count = {
            "A.L":0,
            "AM A.L":0,
            "PM A.L":0,
            "MC":0,
            "E.L":0,
            "WFH":0,
            "PEN":0,
            "KLM":0,
            "OT":0
        };

        dashboardData.leaves
        .forEach(row=>{

            const name =
                row[1];

            const leaveDate =
                new Date(row[2]);

            const type =
                row[3];

            if(
                name===emp &&
                leaveDate.getFullYear()===year &&
                leaveDate.getMonth()+1===month
            ){

                if(
                    count[type] !== undefined
                ){
                    count[type]++;
                }
            }

        });

        html += `
        <tr>

        <td>${emp}</td>

<td class="${count["A.L"]>0 ? 'alLeave' : ''}">
${count["A.L"]}
</td>

<td class="${count["AM A.L"]>0 ? 'alLeave' : ''}">
${count["AM A.L"]}
</td>

<td class="${count["PM A.L"]>0 ? 'alLeave' : ''}">
${count["PM A.L"]}
</td>

<td class="${count["MC"]>0 ? 'mcLeave' : ''}">
${count["MC"]}
</td>

<td class="${count["E.L"]>0 ? 'elLeave' : ''}">
${count["E.L"]}
</td>

<td class="${count["WFH"]>0 ? 'wfhLeave' : ''}">
${count["WFH"]}
</td>

<td class="${count["PEN"]>0 ? 'penLeave' : ''}">
${count["PEN"]}
</td>

<td class="${count["KLM"]>0 ? 'klmLeave' : ''}">
${count["KLM"]}
</td>

<td class="${count["OT"]>0 ? 'otLeave' : ''}">
${count["OT"]}
</td>

        </tr>
        `;
    });

    body.innerHTML = html;
}



function renderLeaveRecords(){
console.log(
    "Leave Records Data",
    dashboardData.leaves
);
    let html = "";

const sortedLeaves =
[...dashboardData.leaves]
.sort((a,b)=>
    new Date(b[2]) - new Date(a[2])
);

sortedLeaves.forEach((row,index)=>{
        html += `
        <tr>
<td>${
new Date(row[2])
.toISOString()
.substring(0,10)
}</td>
            <td>${row[1]}</td>
            <td>${row[3]}</td>
<td style="text-align:left;padding-left:10px;">
    ${row[4] || ""}
</td>

            <td>
                <button onclick="editLeave(${index})">
                    Edit
                </button>

                <button onclick="deleteLeave(${index})">
                    Delete
                </button>
            </td>
        </tr>
        `;

    });

    document.getElementById(
        "leaveRecordBody"
    ).innerHTML = html;

}

function editLeave(id){

    alert(
        "Edit Function : " + id
    );

}

function deleteLeave(id){

    if(
        confirm(
            "Delete this leave record?"
        )
    ){

        alert(
            "Delete Function : " + id
        );

    }

}

async function refreshDashboardData(){

    const response = await fetch(
        API_URL + "?action=dashboard&_=" + Date.now()
    );

    dashboardData = await response.json();

    renderDashboard();
    renderLeaveRecords();
}

async function submitLeave(){

    const data = {
        name: document.getElementById("name").value,
        date: document.getElementById("date").value,
        leaveType: document.getElementById("leaveType").value,
        reason: document.getElementById("reason").value || "N/A"
    };

    try{

        const response = await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(data)
        });

        if(!response.ok){
            throw new Error("Submission failed");
        }

        alert("✅ Leave Application Submitted Successfully");

        document.getElementById("msg").innerHTML =
            "<span style='color:green;font-weight:bold'>✅ Submitted Successfully</span>";


const refreshResponse = await fetch(
    API_URL + "?action=dashboard&_=" + Date.now()
);

dashboardData = await refreshResponse.json();

renderDashboard();
renderLeaveRecords();




// Clear form for next entry
document.getElementById("name").value = "";
document.getElementById("leaveType").value = "";
document.getElementById("reason").value = "";

// Reset date to today
document.getElementById("date")._flatpickr.setDate(new Date());

// Move cursor back to Name field
document.getElementById("name").focus();




    }catch(err){

        alert("❌ Submission Failed");

        document.getElementById("msg").innerHTML =
            "<span style='color:red;font-weight:bold'>❌ Submission Failed</span>";

        console.error(err);
    }
}


</script>
